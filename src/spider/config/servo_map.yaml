# Spider servo channel map + per-servo calibration.
#
# 每一路包含三类信息：
#   1. channel / leg / joint  语义映射：这个通道驱动哪条腿的哪个关节
#   2. direction              标定：+1 或 -1，吃掉左右镜像 / 舵机安装方向
#   3. offset_ddeg            标定：单位 0.1°，含义是"数学角为 0 时舵机应有的读数"
#
# 上位机映射公式（Servo18Mapper）：
#   servo_ddeg = direction * math_ddeg + offset_ddeg
# 再夹取到合法区间 [0, 1800]。
#
# 职责划分（见 工程现状总结.md 决策 D3）：
#   - 标定由上位机负责，因此 /spider/servo_target 里发出去的就是"真实舵机角"；
#   - 下位机 kServoMap 里的同名参数保持 direction=1 / offset=0 作为透传兜底，
#     只保留硬夹取，不再重复标定。
#
# 注意：当前所有标定值都是"不标定"的默认状态，必须实机标定后再填写。
#   - direction 先全部按 +1 填，哪一路方向反了就改成 -1；
#   - offset_ddeg 按"数学角为 0 时量到的舵机读数"填。
servo_map:
  - channel: 0
    leg: lf
    joint: coxa
    direction: 1
    offset_ddeg: 0
  - channel: 1
    leg: lf
    joint: femur
    direction: 1
    offset_ddeg: 0
