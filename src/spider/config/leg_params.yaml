# Spider leg geometry placeholder.
# 具体尺寸后续根据真实结构再确认，当前先把参数名字固定下来。
# 本阶段新增最小六足静态组织参数，用来生成默认站立足端布局。
leg_params:
  # 腿长：目前仍是占位值，还没有被用来构建 KDL 链（链在 leg_calc/demo_chain.cpp 里）。
  coxa_length_mm: 0.0
  femur_length_mm: 0.0
  tibia_length_mm: 0.0

  # 默认站立姿态的足端布局（身体坐标系）
  body_height_mm: 250.0
  default_left_y_mm: 120.0
  default_right_y_mm: -120.0
  front_x_mm: 180.0
  middle_x_mm: 0.0
  rear_x_mm: -180.0

  # 关节角机械限位（单位：度），顺序固定为 coxa / femur / tibia。
  #
  # 作用：IK 求出的解只要数值收敛，求解器就认为成功，但那个角度机械上可能
  # 根本转不到（demo 链上 femur 就解出过 −24°）。超出限位的解会和"够不着"
  # 一样被拒绝，改为保留上一条可信解。
  #
  # 注意：当前是**占位值**，只保证现阶段的 demo 步态能通过（实测范围约为
  # coxa 0°、femur −24°~+7°、tibia 69°~98°）。真实机械确定后必须重新填写，
  # 否则要么误拒合法解，要么放过危险解。
  coxa_min_deg: -90.0
  coxa_max_deg: 90.0
  femur_min_deg: -60.0
  femur_max_deg: 60.0
  tibia_min_deg: -30.0
  tibia_max_deg: 150.0
