# 六足机械参数。
#
# 数值来源：机械图纸（~/Desktop/exist_urdf/hardware）。配套说明见 "工程现状总结.md"。
# 单位：长度 mm，角度 deg；代码读入后统一换算成米和弧度。
#
# 坐标系约定（决策 D1）：
#   身体坐标系  spider_base ：x 前为正 / y 左为正 / z 上为正
#   腿局部坐标系           ：原点在髋关节轴线上，x 沿 coxa 指向这条腿的**外侧**，z 向上
#
# 注意：地面在 z 的负方向。足端 z 越负，机身站得越高。
leg_params:
  # ---------------------------------------------------------------------------
  # 单腿连杆长度（相邻铰链轴之间的距离）
  # ---------------------------------------------------------------------------
  coxa_length_mm: 60.3
  femur_length_mm: 89.5
  tibia_length_mm: 154.745

  # ---------------------------------------------------------------------------
  # 归位姿态：足端在**腿局部坐标系**里的位置
  # ---------------------------------------------------------------------------
  # 用腿局部坐标而不是身体坐标，是因为六条腿的局部坐标轴已经按各自的 yaw
  # 转到了朝外——"足端在髋轴外侧多远、下方多深"对六条腿是同一个描述，
  # 一个向量就够，不需要按腿分别配置。
  #
  # 图纸的 HOME_POS：足端在髋轴外侧 121.8mm、下方 91.4mm。
  # 想整体升降机身，改第三个分量：负得越多，站得越高。
  home_local_mm: [121.8, 0.0, -91.4]

  # ---------------------------------------------------------------------------
  # 六个腿座
  # ---------------------------------------------------------------------------
  # 只配**左侧**三条，右侧由镜像得到（x 不变、y 取负、yaw 取负），
  # 因为图纸本身就是镜像对称的。
  #
  #   mount_x_mm / mount_y_mm : 髋关节轴在身体坐标系里的位置
  #   yaw_deg                 : 腿座绕竖直轴的朝向，0 = 腿朝身体正前方
  #
  # yaw 很重要：它让每条腿的局部 x 轴指向外侧。如果全部填 0，
  # 中腿就得靠 coxa 关节转 90° 才能伸到侧面，那已经贴着限位了。
  front_mount_x_mm:  96.52
  front_mount_y_mm:  75.13
  front_yaw_deg:     45.0

  middle_mount_x_mm:   0.0
  middle_mount_y_mm: 100.1
  middle_yaw_deg:     90.0

  rear_mount_x_mm:  -96.52
  rear_mount_y_mm:   75.13
  rear_yaw_deg:     135.0

  # ---------------------------------------------------------------------------
  # 关节角机械限位（数学角，单位 deg），顺序固定为 coxa / femur / tibia
  # ---------------------------------------------------------------------------
  # 来自图纸。注意 femur 的区间是对称的，所以即使我们的关节符号与图纸相反，
  # 上下界也不需要翻转。
  #
  # 作用：IK 求出的解只要数值收敛，求解器就认为成功，但那个角度机械上可能
  # 根本转不到。超出限位的解会和"够不着"一样被拒绝，改为保留上一条可信解。
  #
  # TODO：真实机械装配完成后重新核对。当前值取自图纸，尚未在实物上验证。
  coxa_min_deg: -80.0
  coxa_max_deg:  80.0
  femur_min_deg: -80.0
  femur_max_deg:  80.0
  tibia_min_deg:  50.0
  tibia_max_deg: 165.0
