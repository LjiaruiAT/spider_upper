# robot_driver 的运行参数。
#
# 这是一个 **ROS 参数文件**（顶层是节点名，下面是 ros__parameters），
# 由 launch 传给 robot_driver_node。与 spider 包里的"机器人属性配置"
# （leg_params / servo_map，节点自己解析）刻意不同：
#   · 机器人属性：几何、映射、标定 —— 被多个程序共读，放 spider 包；
#   · 节点运行参数：设备名、波特率、开关 —— 跟节点绑定，用 ROS 参数文件，
#     启动时可以只覆盖单个值：
#       ros2 run robot_driver robot_driver_node --ros-args -p device_name:=/dev/ttyUSB0
#
# 状态（2026-10-05）：**真发送已实现**。
#   · fake_send=true  → 只打印协议帧，不碰设备（默认，安全）
#   · fake_send=false → 真发串口；**打不开设备会启动失败**（明确报错，不静默降级）；
#                       运行中断线会自动尝试重连（1 秒节流）
#   · readback_enabled 仍必须为 false（回读未实现）
#
# 设备名建议用 udev 固定名（见 调试方法.md §7）：
#   /etc/udev/rules.d/99-stm32-cdc.rules → SYMLINK+="spider_stm32"
# 没有 udev 规则时按实际设备名填（如 /dev/ttyACM1；注意 J-Link 常占 ttyACM0）。
robot_driver_node:
  ros__parameters:
    device_name: /dev/spider_stm32
    baud_rate: 115200
    fake_send: true
    readback_enabled: false
